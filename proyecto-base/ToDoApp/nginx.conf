# Plantilla de nginx: la imagen oficial reemplaza ${PORT} y ${API_UPSTREAM}
# con las variables de entorno al arrancar el contenedor (envsubst).
#   Local (compose):  API_UPSTREAM=http://api:8080
#   Render:           API_UPSTREAM=https://<tu-api>.onrender.com
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy inverso: el navegador llama a /api en el mismo origen
    # y nginx lo reenvía a la API (sin CORS ni URL fija en el JavaScript).
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        # Necesario para upstreams HTTPS (Render): SNI y Host del destino.
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas de Angular (SPA): cualquier ruta desconocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash se pueden cachear mucho tiempo
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
