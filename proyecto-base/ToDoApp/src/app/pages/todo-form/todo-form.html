<h1>{{ editingId ? 'Update ToDo Item' : 'New ToDo Item ' }}</h1>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="todo-form">

    <label for="title">Title</label>
    <input id="title" type="text" formControlName="title" />

    @if (form.controls.title.invalid && form.controls.title.touched) {

    <p class="field-error">Title is required</p>
    }


    <label for="description">Description</label>
    <textarea id="description" formControlName="description" rows="3"></textarea>

    @if (errorMessage()) {
    <p class="field-error">{{ errorMessage() }}</p>
    }

    <div class="form-actions">
        <button type="submit">{{ editingId ? 'Update Task' : 'Create Task' }}</button>
        <a routerLink="/tasks">Cancel</a>
    </div>

</form>
