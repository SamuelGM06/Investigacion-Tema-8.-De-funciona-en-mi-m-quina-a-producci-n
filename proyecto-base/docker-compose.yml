# =============================================================================
# Levanta todo el sistema de tareas con un solo comando:
#     cp .env.example .env      # y editar los valores
#     docker compose up --build
#
#   web  -> http://localhost:${WEB_PORT}   (Angular servido por nginx)
#   api  -> http://localhost:${API_PORT}   (ASP.NET Core)  /health = estado
#   db   -> SQL Server 2022 (solo accesible dentro de la red de compose)
#
# Los secretos vienen del archivo .env (ignorado por git), nunca de este archivo.
# =============================================================================
name: todoapp

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en el archivo .env}
    volumes:
      - sqldata:/var/opt/mssql          # los datos sobreviven a `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build: ./TodoApi
    image: todoapp-api:local
    depends_on:
      db:
        condition: service_healthy      # no arranca hasta que SQL Server responda
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=TodoApiDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY en el archivo .env}
      Database__MigrateOnStartup: "true"
      Cors__AllowedOrigins__0: "http://localhost:${WEB_PORT:-4200}"
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  web:
    build: ./ToDoApp
    image: todoapp-web:local
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4200}:80"
    restart: unless-stopped

volumes:
  sqldata:
